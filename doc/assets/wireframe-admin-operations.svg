<svg width="1800" height="900" viewBox="0 0 1800 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .frame { fill: #ffffff; stroke: #2d2d2d; stroke-width: 3; }
      .panel { fill: #f2f2f2; stroke: #2d2d2d; stroke-width: 2.5; }
      .soft { fill: #dcdcdc; stroke: #2d2d2d; stroke-width: 2; }
      .muted { stroke: #777; stroke-width: 1.5; }
      .label { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 23px; font-weight: 500; fill: #b23a3a; }
      .ui { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 24px; fill: #111; }
      .title { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 32px; fill: #111; font-weight: 600; }
      .tiny { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 19px; fill: #666; }
      .arrow { stroke: #b23a3a; stroke-width: 2.4; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#b23a3a" />
    </marker>
  </defs>

  <!-- Browser window -->
  <rect x="290" y="100" width="1220" height="700" class="frame"/>
  <rect x="290" y="100" width="1220" height="50" fill="#4f4f4f" stroke="#2d2d2d" stroke-width="3"/>
  <circle cx="316" cy="125" r="6" fill="#ff5f57"/>
  <circle cx="336" cy="125" r="6" fill="#febc2e"/>
  <circle cx="356" cy="125" r="6" fill="#28c840"/>
  <rect x="390" y="112" width="1080" height="26" rx="8" fill="#6a6a6a"/>

  <!-- Navigation rail -->
  <rect x="314" y="174" width="236" height="600" rx="22" class="panel"/>
  <text x="350" y="228" class="title">Navigation</text>
  <line x1="350" y1="262" x2="476" y2="262" class="muted"/>
  <line x1="350" y1="308" x2="488" y2="308" class="muted"/>
  <line x1="350" y1="342" x2="488" y2="342" class="muted"/>
  <line x1="350" y1="376" x2="488" y2="376" class="muted"/>
  <rect x="338" y="666" width="188" height="78" rx="16" class="frame"/>
  <text x="364" y="704" class="ui">Account footer</text>

  <!-- Title bar -->
  <rect x="578" y="174" width="908" height="72" rx="18" class="panel"/>
  <text x="614" y="222" class="title">Notification and permission controls</text>

  <!-- Notify by activity -->
  <rect x="578" y="272" width="288" height="354" rx="18" class="panel"/>
  <text x="608" y="316" class="ui">Notify by activity</text>
  <rect x="608" y="348" width="228" height="32" rx="14" class="soft"/>
  <rect x="608" y="394" width="228" height="32" rx="14" class="soft"/>
  <rect x="608" y="440" width="228" height="86" rx="12" class="frame"/>

  <!-- Notify by class -->
  <rect x="890" y="272" width="288" height="354" rx="18" class="panel"/>
  <text x="920" y="316" class="ui">Notify by class</text>
  <rect x="920" y="348" width="228" height="32" rx="14" class="soft"/>
  <rect x="920" y="394" width="228" height="32" rx="14" class="soft"/>
  <rect x="920" y="440" width="228" height="86" rx="12" class="frame"/>

  <!-- Authority controls -->
  <rect x="1202" y="272" width="284" height="454" rx="18" class="panel"/>
  <text x="1232" y="316" class="ui">Authority controls</text>
  <rect x="1232" y="348" width="224" height="32" rx="14" class="soft"/>
  <rect x="1232" y="394" width="224" height="32" rx="14" class="soft"/>
  <rect x="1232" y="440" width="224" height="130" rx="12" class="frame"/>

  <!-- ============ LEFT-SIDE ANNOTATIONS ============ -->

  <!-- Navigation -->
  <text x="20" y="226" class="label">Shared admin</text>
  <text x="20" y="252" class="label">navigation rail reused</text>
  <text x="20" y="278" class="label">across every admin</text>
  <text x="20" y="304" class="label">workspace</text>
  <path d="M 260 254 C 290 234, 310 220, 336 206" class="arrow"/>

  <!-- Notify by activity -->
  <text x="20" y="380" class="label">Notify-by-activity panel:</text>
  <text x="20" y="406" class="label">pick an activity and push</text>
  <text x="20" y="432" class="label">a targeted reminder to</text>
  <text x="20" y="458" class="label">all its enrolled volunteers</text>
  <path d="M 290 408 C 400 394, 500 384, 602 392" class="arrow"/>

  <!-- Account footer -->
  <text x="20" y="696" class="label">Signed-in admin and</text>
  <text x="20" y="722" class="label">sign-out control</text>
  <path d="M 260 706 C 290 704, 310 704, 336 704" class="arrow"/>

  <!-- ============ RIGHT-SIDE ANNOTATIONS ============ -->

  <!-- Title bar -->
  <text x="1530" y="180" class="label">Workspace title bar</text>
  <text x="1530" y="206" class="label">identifies the current</text>
  <text x="1530" y="232" class="label">mode</text>
  <path d="M 1528 206 C 1510 206, 1500 208, 1488 208" class="arrow"/>

  <!-- Notify by class -->
  <text x="1530" y="310" class="label">Notify-by-class panel:</text>
  <text x="1530" y="336" class="label">pick a year group or</text>
  <text x="1530" y="362" class="label">class and broadcast to</text>
  <text x="1530" y="388" class="label">everyone in it —</text>
  <text x="1530" y="414" class="label">complements the</text>
  <text x="1530" y="440" class="label">activity notifier</text>
  <path d="M 1528 356 C 1400 356, 1280 376, 1180 400" class="arrow"/>

  <!-- Authority controls -->
  <text x="1530" y="500" class="label">Authority controls for</text>
  <text x="1530" y="526" class="label">configuring authority</text>
  <text x="1530" y="552" class="label">groups: toggle blanket</text>
  <text x="1530" y="578" class="label">access and edit per-</text>
  <text x="1530" y="604" class="label">group permissions</text>
  <path d="M 1528 534 C 1510 516, 1500 498, 1488 480" class="arrow"/>

  <!-- Rationale -->
  <text x="1530" y="680" class="label">Grouped together</text>
  <text x="1530" y="706" class="label">because these are</text>
  <text x="1530" y="732" class="label">sensitive, rarely touched</text>
  <text x="1530" y="758" class="label">operations kept away</text>
  <text x="1530" y="784" class="label">from daily student flows</text>
  <path d="M 1528 716 C 1500 704, 1490 692, 1486 660" class="arrow"/>
</svg>
