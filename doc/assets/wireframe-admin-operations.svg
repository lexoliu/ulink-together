<svg width="1500" height="760" viewBox="166 92 1228 620" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .frame { fill: #ffffff; stroke: #2d2d2d; stroke-width: 3; }
      .panel { fill: #f2f2f2; stroke: #2d2d2d; stroke-width: 2.5; }
      .soft { fill: #dcdcdc; stroke: #2d2d2d; stroke-width: 2; }
      .muted { stroke: #777; stroke-width: 1.5; }
      .label-box { fill: rgba(255,255,255,0.92); stroke: #d65a5a; stroke-width: 1.5; rx: 10; }
      .label { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 20px; font-weight: 600; fill: #b23a3a; }
      .caption { font-family: 'Times New Roman', serif; font-size: 28px; fill: #7c7c7c; font-style: italic; }
      .ui { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 21px; fill: #111; }
      .title { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 30px; fill: #111; font-weight: 600; }
      .arrow { stroke: #b23a3a; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#b23a3a" />
    </marker>
  </defs>

  <rect x="170" y="96" width="1220" height="610" class="frame"/>
  <rect x="196" y="132" width="220" height="536" rx="22" class="panel"/>
  <text x="232" y="184" class="title">Navigation</text>
  <line x1="232" y1="216" x2="354" y2="216" class="muted"/>
  <line x1="232" y1="260" x2="366" y2="260" class="muted"/>
  <line x1="232" y1="294" x2="366" y2="294" class="muted"/>
  <line x1="232" y1="328" x2="366" y2="328" class="muted"/>
  <rect x="220" y="560" width="172" height="74" rx="16" class="frame"/>
  <text x="246" y="596" class="ui">Account footer</text>

  <rect x="452" y="132" width="906" height="68" rx="18" class="panel"/>
  <text x="488" y="176" class="title">Notification and permission controls</text>

  <rect x="452" y="224" width="268" height="322" rx="18" class="panel"/>
  <text x="480" y="266" class="ui">Notify by activity</text>
  <rect x="482" y="302" width="206" height="28" rx="12" class="soft"/>
  <rect x="482" y="344" width="206" height="28" rx="12" class="soft"/>
  <rect x="482" y="386" width="206" height="76" rx="12" class="frame"/>

  <rect x="746" y="224" width="268" height="322" rx="18" class="panel"/>
  <text x="774" y="266" class="ui">Notify by class</text>
  <rect x="776" y="302" width="206" height="28" rx="12" class="soft"/>
  <rect x="776" y="344" width="206" height="28" rx="12" class="soft"/>
  <rect x="776" y="386" width="206" height="76" rx="12" class="frame"/>

  <rect x="1040" y="224" width="318" height="322" rx="18" class="panel"/>
  <text x="1070" y="266" class="ui">Authority controls</text>
  <rect x="1072" y="302" width="254" height="28" rx="12" class="soft"/>
  <rect x="1072" y="344" width="254" height="28" rx="12" class="soft"/>
  <rect x="1072" y="386" width="254" height="114" rx="12" class="frame"/>

  <rect x="1086" y="292" width="182" height="34" class="label-box"/>
