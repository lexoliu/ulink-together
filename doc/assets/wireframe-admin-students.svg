<svg width="1800" height="900" viewBox="0 0 1800 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .frame { fill: #ffffff; stroke: #2d2d2d; stroke-width: 3; }
      .panel { fill: #f2f2f2; stroke: #2d2d2d; stroke-width: 2.5; }
      .soft { fill: #dcdcdc; stroke: #2d2d2d; stroke-width: 2; }
      .muted { stroke: #777; stroke-width: 1.5; }
      .label { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 23px; font-weight: 500; fill: #b23a3a; }
      .ui { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 24px; fill: #111; }
      .title { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 32px; fill: #111; font-weight: 600; }
      .tiny { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 19px; fill: #666; }
      .arrow { stroke: #b23a3a; stroke-width: 2.4; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#b23a3a" />
    </marker>
  </defs>

  <!-- Browser window -->
  <rect x="290" y="100" width="1220" height="700" class="frame"/>
  <rect x="290" y="100" width="1220" height="50" fill="#4f4f4f" stroke="#2d2d2d" stroke-width="3"/>
  <circle cx="316" cy="125" r="6" fill="#ff5f57"/>
  <circle cx="336" cy="125" r="6" fill="#febc2e"/>
  <circle cx="356" cy="125" r="6" fill="#28c840"/>
  <rect x="390" y="112" width="1080" height="26" rx="8" fill="#6a6a6a"/>

  <!-- Navigation rail -->
  <rect x="314" y="174" width="236" height="600" rx="22" class="panel"/>
  <text x="350" y="228" class="title">Navigation</text>
  <line x1="350" y1="262" x2="476" y2="262" class="muted"/>
  <line x1="350" y1="308" x2="488" y2="308" class="muted"/>
  <line x1="350" y1="342" x2="488" y2="342" class="muted"/>
  <line x1="350" y1="376" x2="488" y2="376" class="muted"/>
  <rect x="338" y="666" width="188" height="78" rx="16" class="frame"/>
  <text x="364" y="704" class="ui">Account footer</text>

  <!-- Title bar -->
  <rect x="578" y="174" width="908" height="72" rx="18" class="panel"/>
  <text x="614" y="222" class="title">Review and manage volunteer accounts</text>

  <!-- Batch import / class tools -->
  <rect x="578" y="272" width="374" height="180" rx="18" class="panel"/>
  <text x="608" y="316" class="ui">Batch import / class tools</text>
  <rect x="608" y="346" width="130" height="32" rx="14" class="soft"/>
  <rect x="608" y="392" width="130" height="32" rx="14" class="soft"/>
  <rect x="760" y="346" width="130" height="32" rx="14" class="soft"/>
  <rect x="760" y="392" width="130" height="32" rx="14" class="soft"/>

  <!-- Student list -->
  <rect x="578" y="478" width="316" height="248" rx="18" class="panel"/>
  <text x="608" y="522" class="ui">Student list</text>
  <rect x="608" y="554" width="256" height="32" rx="16" class="soft"/>
  <rect x="608" y="604" width="256" height="52" rx="12" class="frame"/>
  <rect x="608" y="668" width="256" height="52" rx="12" class="frame"/>

  <!-- Selected student profile -->
  <rect x="980" y="272" width="506" height="454" rx="18" class="panel"/>
  <text x="1010" y="316" class="ui">Selected student profile</text>
  <line x1="1010" y1="356" x2="1240" y2="356" class="muted"/>
  <line x1="1010" y1="390" x2="1376" y2="390" class="muted"/>
  <line x1="1010" y1="424" x2="1336" y2="424" class="muted"/>
  <rect x="1010" y="462" width="188" height="200" rx="16" class="frame"/>
  <rect x="1226" y="462" width="226" height="200" rx="16" class="frame"/>

  <!-- ============ LEFT-SIDE ANNOTATIONS ============ -->

  <!-- Navigation -->
  <text x="20" y="226" class="label">Shared admin</text>
  <text x="20" y="252" class="label">navigation rail reused</text>
  <text x="20" y="278" class="label">across every admin</text>
  <text x="20" y="304" class="label">workspace</text>
  <path d="M 260 254 C 290 234, 310 220, 336 206" class="arrow"/>

  <!-- Batch tools -->
  <text x="20" y="374" class="label">Batch import, CSV</text>
  <text x="20" y="400" class="label">upload and class-</text>
  <text x="20" y="426" class="label">assignment tools kept</text>
  <text x="20" y="452" class="label">separate from single</text>
  <text x="20" y="478" class="label">profile edits</text>
  <path d="M 280 400 C 400 388, 500 378, 602 378" class="arrow"/>

  <!-- Student list -->
  <text x="20" y="568" class="label">Searchable student list</text>
  <text x="20" y="594" class="label">filtered by name, class</text>
  <text x="20" y="620" class="label">or role — tap a row to</text>
  <text x="20" y="646" class="label">open the profile</text>
  <path d="M 280 594 C 400 588, 500 584, 602 590" class="arrow"/>

  <!-- Account footer -->
  <text x="20" y="720" class="label">Signed-in admin and</text>
  <text x="20" y="746" class="label">sign-out control</text>
  <path d="M 260 730 C 290 720, 310 712, 336 706" class="arrow"/>

  <!-- ============ RIGHT-SIDE ANNOTATIONS ============ -->

  <!-- Title bar -->
  <text x="1530" y="180" class="label">Workspace title bar</text>
  <text x="1530" y="206" class="label">identifies the current</text>
  <text x="1530" y="232" class="label">management mode</text>
  <path d="M 1528 206 C 1510 206, 1500 208, 1488 208" class="arrow"/>

  <!-- Selected profile -->
  <text x="1530" y="310" class="label">Selected student profile</text>
  <text x="1530" y="336" class="label">stays beside the list so</text>
  <text x="1530" y="362" class="label">switching rows updates</text>
  <text x="1530" y="388" class="label">it in place — no full</text>
  <text x="1530" y="414" class="label">page navigation</text>
  <path d="M 1528 350 C 1510 340, 1500 330, 1488 324" class="arrow"/>

  <!-- Profile fields -->
  <text x="1530" y="482" class="label">Personal info (name,</text>
  <text x="1530" y="508" class="label">class, email, avatar) and</text>
  <text x="1530" y="534" class="label">computed fields such as</text>
  <text x="1530" y="560" class="label">total confirmed hours</text>
  <path d="M 1528 516 C 1490 470, 1460 428, 1442 404" class="arrow"/>

  <!-- Activity history / stats -->
  <text x="1530" y="620" class="label">Activity history and</text>
  <text x="1530" y="646" class="label">participation cards</text>
  <text x="1530" y="672" class="label">shown as two side-by-</text>
  <text x="1530" y="698" class="label">side panels for quick</text>
  <text x="1530" y="724" class="label">review</text>
  <path d="M 1528 660 C 1500 630, 1480 600, 1458 572" class="arrow"/>
</svg>
