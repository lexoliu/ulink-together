  <rect x="1168" y="580" width="136" height="28" rx="14" class="soft"/>

  <text x="304" y="232" class="label">Rail</text>
  <path d="M 348 234 C 318 232, 278 228, 198 222" class="arrow"/>

  <text x="968" y="130" class="label">Review panel</text>
  <path d="M 1056 134 C 1070 154, 1082 180, 1096 220" class="arrow"/>

  <text x="948" y="420" class="label">Actions by records</text>
