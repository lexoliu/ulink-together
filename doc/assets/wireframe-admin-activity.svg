<svg width="1800" height="900" viewBox="0 0 1800 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .frame { fill: #ffffff; stroke: #2d2d2d; stroke-width: 3; }
      .panel { fill: #f2f2f2; stroke: #2d2d2d; stroke-width: 2.5; }
      .soft { fill: #dcdcdc; stroke: #2d2d2d; stroke-width: 2; }
      .muted { stroke: #777; stroke-width: 1.5; }
      .label { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 23px; font-weight: 500; fill: #b23a3a; }
      .ui { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 24px; fill: #111; }
      .title { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 32px; fill: #111; font-weight: 600; }
      .tiny { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 19px; fill: #666; }
      .arrow { stroke: #b23a3a; stroke-width: 2.4; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#b23a3a" />
    </marker>
  </defs>

  <!-- Browser window (admin is a React web app — keep traffic lights + URL bar) -->
  <rect x="290" y="100" width="1220" height="700" class="frame"/>
  <rect x="290" y="100" width="1220" height="50" fill="#4f4f4f" stroke="#2d2d2d" stroke-width="3"/>
  <circle cx="316" cy="125" r="6" fill="#ff5f57"/>
  <circle cx="336" cy="125" r="6" fill="#febc2e"/>
  <circle cx="356" cy="125" r="6" fill="#28c840"/>
  <rect x="390" y="112" width="1080" height="26" rx="8" fill="#6a6a6a"/>

  <!-- Navigation rail -->
  <rect x="314" y="174" width="236" height="600" rx="22" class="panel"/>
  <text x="350" y="228" class="title">Navigation</text>
  <line x1="350" y1="262" x2="476" y2="262" class="muted"/>
  <line x1="350" y1="308" x2="488" y2="308" class="muted"/>
  <line x1="350" y1="342" x2="488" y2="342" class="muted"/>
  <line x1="350" y1="376" x2="488" y2="376" class="muted"/>
  <line x1="350" y1="410" x2="488" y2="410" class="muted"/>
  <rect x="338" y="666" width="188" height="78" rx="16" class="frame"/>
  <text x="364" y="704" class="ui">Account footer</text>

  <!-- Title bar -->
  <rect x="578" y="174" width="908" height="72" rx="18" class="panel"/>
  <text x="614" y="222" class="title">Manage publishing, records, and readiness</text>

  <!-- Activity rail -->
  <rect x="578" y="272" width="316" height="454" rx="18" class="panel"/>
  <text x="608" y="316" class="ui">Activity rail</text>
  <rect x="608" y="344" width="256" height="34" rx="17" class="soft"/>
  <rect x="608" y="404" width="256" height="104" rx="16" class="frame"/>
  <rect x="608" y="524" width="256" height="104" rx="16" class="frame"/>

  <!-- Selected activity overview -->
  <rect x="918" y="272" width="568" height="200" rx="18" class="panel"/>
  <text x="948" y="316" class="ui">Selected activity overview</text>
  <line x1="948" y1="356" x2="1236" y2="356" class="muted"/>
  <line x1="948" y1="390" x2="1408" y2="390" class="muted"/>
  <line x1="948" y1="424" x2="1348" y2="424" class="muted"/>

  <!-- Records / comments -->
  <rect x="918" y="498" width="354" height="228" rx="18" class="panel"/>
  <text x="948" y="540" class="ui">Records / comments</text>
  <line x1="948" y1="580" x2="1218" y2="580" class="muted"/>
  <line x1="948" y1="614" x2="1202" y2="614" class="muted"/>
  <line x1="948" y1="648" x2="1232" y2="648" class="muted"/>

  <!-- Participation column -->
  <rect x="1296" y="498" width="190" height="228" rx="18" class="panel"/>
  <text x="1324" y="540" class="ui">Participation</text>
  <rect x="1322" y="568" width="138" height="30" rx="15" class="soft"/>
  <rect x="1322" y="614" width="122" height="30" rx="15" class="soft"/>
  <rect x="1322" y="660" width="140" height="30" rx="15" class="soft"/>

  <!-- ============ LEFT-SIDE ANNOTATIONS ============ -->

  <!-- Navigation -->
  <text x="20" y="226" class="label">Persistent left-hand</text>
  <text x="20" y="252" class="label">navigation rail with</text>
  <text x="20" y="278" class="label">links to every admin</text>
  <text x="20" y="304" class="label">workspace</text>
  <path d="M 260 254 C 290 234, 310 220, 336 206" class="arrow"/>

  <!-- Activity rail -->
  <text x="20" y="390" class="label">Scrollable activity rail</text>
  <text x="20" y="416" class="label">with a search filter;</text>
  <text x="20" y="442" class="label">selecting a card loads</text>
  <text x="20" y="468" class="label">its detail column</text>
  <path d="M 280 428 C 400 410, 500 394, 602 394" class="arrow"/>

  <!-- Account footer -->
  <text x="20" y="698" class="label">Account footer with</text>
  <text x="20" y="724" class="label">the signed-in admin</text>
  <text x="20" y="750" class="label">and sign-out control</text>
  <path d="M 260 714 C 290 708, 310 704, 336 702" class="arrow"/>

  <!-- ============ RIGHT-SIDE ANNOTATIONS ============ -->

  <!-- Title bar -->
  <text x="1530" y="180" class="label">Workspace title bar</text>
  <text x="1530" y="206" class="label">anchored at the top so</text>
  <text x="1530" y="232" class="label">the current mode is</text>
  <text x="1530" y="258" class="label">always visible</text>
  <path d="M 1528 206 C 1510 206, 1500 208, 1488 208" class="arrow"/>

  <!-- Selected overview -->
  <text x="1530" y="310" class="label">Selected activity</text>
  <text x="1530" y="336" class="label">overview: title,</text>
  <text x="1530" y="362" class="label">schedule, location,</text>
  <text x="1530" y="388" class="label">capacity and current</text>
  <text x="1530" y="414" class="label">lifecycle state</text>
  <path d="M 1528 348 C 1510 348, 1500 356, 1488 360" class="arrow"/>

  <!-- Records -->
  <text x="1530" y="484" class="label">Records and comments</text>
  <text x="1530" y="510" class="label">column listing volunteer</text>
  <text x="1530" y="536" class="label">participations and chat</text>
  <text x="1530" y="562" class="label">messages for the activity</text>
  <path d="M 1528 534 C 1440 550, 1340 570, 1274 584" class="arrow"/>

  <!-- Participation actions -->
  <text x="1530" y="620" class="label">Per-activity participation</text>
  <text x="1530" y="646" class="label">actions (approve hours,</text>
  <text x="1530" y="672" class="label">change state, remove</text>
  <text x="1530" y="698" class="label">volunteer) pinned beside</text>
  <text x="1530" y="724" class="label">the records</text>
  <path d="M 1528 666 C 1510 660, 1500 650, 1488 630" class="arrow"/>
</svg>
