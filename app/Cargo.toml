[package]
name = "together"
version = "0.1.0"
edition = "2024"
authors = ["Lexo Liu"]

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
waterui = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-ffi = { git = "https://github.com/water-rs/waterui", branch = "dev" }
zenwave.workspace = true
tokio = { version = "1.39", features = ["macros", "rt-multi-thread", "sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
futures = "0.3"
url = "2.5"
thiserror = "1.0"
