<svg width="1500" height="760" viewBox="140 70 1280 660" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .frame { fill: #ffffff; stroke: #2d2d2d; stroke-width: 3; }
      .panel { fill: #f2f2f2; stroke: #2d2d2d; stroke-width: 2.5; }
      .soft { fill: #dcdcdc; stroke: #2d2d2d; stroke-width: 2; }
      .muted { stroke: #777; stroke-width: 1.5; }
      .label-box { fill: rgba(255,255,255,0.92); stroke: #d65a5a; stroke-width: 1.5; rx: 10; }
      .label { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 18px; font-weight: 600; fill: #b23a3a; }
      .caption { font-family: 'Times New Roman', serif; font-size: 28px; fill: #7c7c7c; font-style: italic; }
      .ui { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 20px; fill: #111; }
      .title { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 28px; fill: #111; font-weight: 600; }
      .arrow { stroke: #b23a3a; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#b23a3a" />
    </marker>
  </defs>

  <rect x="170" y="96" width="1220" height="610" class="frame"/>
  <rect x="196" y="132" width="220" height="536" rx="22" class="panel"/>
  <text x="232" y="184" class="title">Navigation</text>
  <line x1="232" y1="216" x2="354" y2="216" class="muted"/>
  <line x1="232" y1="260" x2="366" y2="260" class="muted"/>
  <line x1="232" y1="294" x2="366" y2="294" class="muted"/>
  <line x1="232" y1="328" x2="366" y2="328" class="muted"/>
  <rect x="220" y="560" width="172" height="74" rx="16" class="frame"/>
  <text x="246" y="596" class="ui">Account footer</text>

  <rect x="452" y="132" width="906" height="68" rx="18" class="panel"/>
  <text x="488" y="176" class="title">Review and manage volunteer accounts</text>

  <rect x="452" y="224" width="360" height="166" rx="18" class="panel"/>
  <text x="482" y="266" class="ui">Batch import / class tools</text>
  <rect x="482" y="300" width="122" height="28" rx="12" class="soft"/>
  <rect x="482" y="340" width="122" height="28" rx="12" class="soft"/>
  <rect x="628" y="300" width="122" height="28" rx="12" class="soft"/>
  <rect x="628" y="340" width="122" height="28" rx="12" class="soft"/>

  <rect x="452" y="418" width="306" height="218" rx="18" class="panel"/>
  <text x="482" y="460" class="ui">Student list</text>
  <rect x="482" y="490" width="246" height="28" rx="14" class="soft"/>
  <rect x="482" y="536" width="246" height="48" rx="12" class="frame"/>
  <rect x="482" y="596" width="246" height="48" rx="12" class="frame"/>

  <rect x="844" y="224" width="484" height="412" rx="18" class="panel"/>
  <text x="874" y="266" class="ui">Selected student profile</text>
  <line x1="874" y1="304" x2="1104" y2="304" class="muted"/>
  <line x1="874" y1="338" x2="1224" y2="338" class="muted"/>
  <line x1="874" y1="372" x2="1188" y2="372" class="muted"/>
  <rect x="874" y="408" width="180" height="178" rx="16" class="frame"/>
  <rect x="1080" y="408" width="216" height="178" rx="16" class="frame"/>

  <rect x="924" y="194" width="250" height="34" class="label-box"/>
  <text x="942" y="216" class="label">Profile stays beside the student list</text>
  <path d="M 1084 228 C 1090 248, 1092 268, 1086 300" class="arrow"/>

  <rect x="206" y="294" width="246" height="34" class="label-box"/>
  <text x="224" y="316" class="label">Batch tools stay separate from profiles</text>
  <path d="M 440 328 C 454 328, 470 322, 482 312" class="arrow"/>

</svg>
