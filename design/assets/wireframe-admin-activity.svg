<svg width="1500" height="760" viewBox="140 70 1280 660" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .frame { fill: #ffffff; stroke: #2d2d2d; stroke-width: 3; }
      .panel { fill: #f2f2f2; stroke: #2d2d2d; stroke-width: 2.5; }
      .soft { fill: #dcdcdc; stroke: #2d2d2d; stroke-width: 2; }
      .muted { stroke: #777; stroke-width: 1.5; }
      .label-box { fill: rgba(255,255,255,0.92); stroke: #d65a5a; stroke-width: 1.5; rx: 10; }
      .label { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 18px; font-weight: 600; fill: #b23a3a; }
      .caption { font-family: 'Times New Roman', serif; font-size: 28px; fill: #7c7c7c; font-style: italic; }
      .ui { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 20px; fill: #111; }
      .title { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 28px; fill: #111; font-weight: 600; }
      .tiny { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 16px; fill: #666; }
      .arrow { stroke: #b23a3a; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#b23a3a" />
    </marker>
  </defs>

  <rect x="170" y="96" width="1220" height="610" class="frame"/>
  <rect x="196" y="132" width="220" height="536" rx="22" class="panel"/>
  <text x="232" y="184" class="title">Navigation</text>
  <line x1="232" y1="216" x2="354" y2="216" class="muted"/>
  <line x1="232" y1="260" x2="366" y2="260" class="muted"/>
  <line x1="232" y1="294" x2="366" y2="294" class="muted"/>
  <line x1="232" y1="328" x2="366" y2="328" class="muted"/>
  <line x1="232" y1="362" x2="366" y2="362" class="muted"/>
  <rect x="220" y="560" width="172" height="74" rx="16" class="frame"/>
  <text x="246" y="596" class="ui">Account footer</text>

  <rect x="452" y="132" width="906" height="68" rx="18" class="panel"/>
  <text x="488" y="176" class="title">Manage publishing, records, and readiness</text>

  <rect x="452" y="224" width="306" height="412" rx="18" class="panel"/>
  <text x="482" y="266" class="ui">Activity rail</text>
  <rect x="482" y="292" width="246" height="30" rx="15" class="soft"/>
  <rect x="482" y="348" width="246" height="92" rx="16" class="frame"/>
  <rect x="482" y="458" width="246" height="92" rx="16" class="frame"/>

  <rect x="784" y="224" width="544" height="180" rx="18" class="panel"/>
  <text x="814" y="266" class="ui">Selected activity overview</text>
  <line x1="814" y1="302" x2="1100" y2="302" class="muted"/>
  <line x1="814" y1="334" x2="1258" y2="334" class="muted"/>
  <line x1="814" y1="366" x2="1210" y2="366" class="muted"/>

  <rect x="784" y="430" width="334" height="206" rx="18" class="panel"/>
  <text x="814" y="470" class="ui">Records / comments</text>
  <line x1="814" y1="504" x2="1068" y2="504" class="muted"/>
  <line x1="814" y1="536" x2="1052" y2="536" class="muted"/>
  <line x1="814" y1="568" x2="1082" y2="568" class="muted"/>

  <rect x="1142" y="430" width="186" height="206" rx="18" class="panel"/>
  <text x="1170" y="470" class="ui">Participation</text>
  <rect x="1168" y="496" width="132" height="28" rx="14" class="soft"/>
  <rect x="1168" y="538" width="118" height="28" rx="14" class="soft"/>
  <rect x="1168" y="580" width="136" height="28" rx="14" class="soft"/>

  <rect x="188" y="210" width="204" height="34" class="label-box"/>
  <text x="206" y="232" class="label">Activity rail supports switching</text>
  <path d="M 402 244 C 430 250, 454 264, 482 306" class="arrow"/>

  <rect x="944" y="96" width="234" height="34" class="label-box"/>
  <text x="962" y="118" class="label">Selected activity stays in focus</text>
  <path d="M 1106 130 C 1112 154, 1110 180, 1092 220" class="arrow"/>

  <rect x="870" y="398" width="274" height="34" class="label-box"/>
  <text x="888" y="420" class="label">Participation actions stay beside records</text>
  <path d="M 1126 432 C 1162 450, 1200 480, 1232 530" class="arrow"/>

</svg>
