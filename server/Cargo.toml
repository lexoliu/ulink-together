[package]
name = "together-server"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.32.0", features = ["macros", "rt-multi-thread"] }
skyzen.workspace = true
async-std = "1.12.0"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "macros", "sqlite", "uuid", "chrono", "migrate"] }
serde = { version = "1.0.188" ,features = ["derive"]}
bytes = "1.5.0"
ring = "0.16.20"
rand = "0.8.5"
time = "0.3.28"
hex = "0.4.3"
bytestr = { version = "0.1.0", features = ["serde"] }
log = "0.4.20"
futures-util = "0.3.28"
uuid = { version = "1.4", features = ["serde", "v4"] }
utoipa = "5.4.0"
linkme = "0.3.35"
tracing = "0.1.41"
